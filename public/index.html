<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eedd">
  <title>Mao Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════ Join screen ═══════════════ -->
  <div id="join-screen">
    <main class="panel join-panel">
      <p class="join-kanji" aria-hidden="true">耽美</p>
      <h1 class="join-title">Mao</h1>
      <p class="join-tag">A most civilised game of cards &amp; consequence</p>
      <div class="divider" aria-hidden="true"><span>◆</span></div>

      <div class="join-fields">
        <label class="field">
          <span class="field-label">Your name</span>
          <input id="join-name" type="text" autocomplete="off" maxlength="24" placeholder="e.g. Beatrice">
        </label>
        <label class="field">
          <span class="field-label">Room code <em>(joining only)</em></span>
          <input id="join-room" type="text" autocomplete="off" maxlength="4" placeholder="ABCD" autocapitalize="characters" spellcheck="false">
        </label>
      </div>

      <p id="join-error" role="alert" hidden></p>

      <div class="join-actions">
        <button id="btn-create" class="btn-gold" type="button">Create room</button>
        <button id="btn-join" class="btn-gold" type="button">Join room</button>
      </div>
    </main>
  </div>

  <!-- ═══════════════ Game screen ═══════════════ -->
  <div id="game-screen">
    <main id="main-zone">

      <!-- 1 · Table -->
      <section id="table-zone" aria-label="Table">
        <span id="room-code" class="room-chip">Room <b>····</b></span>
        <div class="pile">
          <button id="deck-pile" type="button" aria-label="Draw a card">
            <span class="card card-back" aria-hidden="true"></span>
            <span id="deck-count" class="deck-count">–</span>
          </button>
          <span class="pile-label">Deck</span>
        </div>
        <div class="pile">
          <div id="discard-top"><!-- top discard rendered by client.js --></div>
          <span class="pile-label">Discard</span>
        </div>
      </section>

      <!-- Mobile sheet buttons (hidden on desktop) -->
      <div id="sheet-buttons">
        <button id="open-players" class="btn-gold" type="button">Players</button>
        <button id="open-log" class="btn-gold" type="button">Log</button>
      </div>

      <!-- 2 · Hand dock -->
      <section id="hand-dock" aria-label="Your hand">
        <div id="hand-fan"><!-- hand rendered by client.js --></div>
      </section>
    </main>

    <div id="sidebar">
      <!-- 3 · Players -->
      <aside id="players-panel" class="panel" aria-label="Players">
        <header class="panel-head">
          <h2>Players</h2>
          <button class="sheet-close" data-close type="button" aria-label="Close players panel">×</button>
        </header>
        <div id="host-controls">
          <span class="host-tag">Host</span>
          <button class="btn-gold deal" type="button" data-count="3">Deal 3</button>
          <button class="btn-gold deal" type="button" data-count="5">Deal 5</button>
        </div>
        <input id="player-search" type="search" placeholder="Search players…" aria-label="Search players">
        <ul id="roster"><!-- mock rows injected --></ul>
      </aside>

      <!-- 4 · Action feed -->
      <aside id="log-panel" class="panel" aria-label="Action log">
        <header class="panel-head">
          <h2>Action</h2>
          <button class="sheet-close" data-close type="button" aria-label="Close log panel">×</button>
        </header>
        <ul id="action-log" aria-live="polite"><!-- entries rendered by client.js --></ul>
      </aside>
    </div>

    <div id="scrim" hidden></div>
    <div id="toast" role="status" hidden></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="cards.js"></script>
  <script src="client.js"></script>
</body>
</html>
